name: UV-Warner APK bauen

on:
  push:
    branches: ["**"]
    paths:
      - "uvwarner/**"
      - ".github/workflows/uvwarner.yml"
    tags: ["uv-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uvwarner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UV_KEYSTORE_BASE64: ${{ secrets.UV_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Signaturschlüssel entpacken (nur wenn hinterlegt)
        if: env.UV_KEYSTORE_BASE64 != ''
        run: |
          echo "$UV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/uvwarner.jks"
          echo "UV_KEYSTORE_FILE=$RUNNER_TEMP/uvwarner.jks" >> "$GITHUB_ENV"

      - name: APK bauen
        working-directory: uvwarner
        env:
          UV_KEYSTORE_PASSWORD: ${{ secrets.UV_KEYSTORE_PASSWORD }}
          UV_KEY_ALIAS: ${{ secrets.UV_KEY_ALIAS }}
          UV_KEY_PASSWORD: ${{ secrets.UV_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: APK umbenennen
        run: |
          mkdir -p dist
          cp uvwarner/app/build/outputs/apk/release/app-release.apk dist/UV-Warner.apk

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: UV-Warner-APK
          path: dist/UV-Warner.apk
          if-no-files-found: error

      - name: Release veröffentlichen (nur bei Tag uv-v*)
        if: startsWith(github.ref, 'refs/tags/uv-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/UV-Warner.apk \
            --title "UV-Warner ${GITHUB_REF_NAME#uv-}" \
            --notes "UV-Warner APK. Installation aus unbekannter Quelle bestätigen. Ab Android 8." \
            || gh release upload "${GITHUB_REF_NAME}" dist/UV-Warner.apk --clobber
